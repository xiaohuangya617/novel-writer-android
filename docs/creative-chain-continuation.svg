<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-labelledby="title desc">
  <title id="title">续写作品创作链</title>
  <desc id="desc">导入并选取原文，分批分析和修复 JSON，融合资料后自动创建新书并回填。</desc>
  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 Z" fill="#64748b"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#94a3b8" flood-opacity="0.22"/></filter>
    <style>
      .title { font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; font-size: 15px; font-weight: 700; fill: #334155; text-anchor: middle; }
      .head { font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; font-size: 17px; font-weight: 700; fill: #172033; text-anchor: middle; }
      .body { font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; font-size: 15px; fill: #334155; text-anchor: middle; }
      .arrow { stroke: #64748b; stroke-width: 2.5; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="250" rx="18" fill="#f8fafc"/>
  <text class="title" x="600" y="29">导入选取 → 分析融合 → 自动建书</text>
  <line class="arrow" x1="395" y1="137" x2="425" y2="137"/>
  <line class="arrow" x1="775" y1="137" x2="805" y2="137"/>
  <g filter="url(#shadow)">
    <rect x="45" y="58" width="350" height="158" rx="16" fill="#ffffff" stroke="#0284c7" stroke-width="2.5"/>
    <rect x="45" y="58" width="350" height="43" rx="16" fill="#e0f2fe"/>
    <rect x="45" y="84" width="350" height="17" fill="#e0f2fe"/>
    <rect x="425" y="58" width="350" height="158" rx="16" fill="#ffffff" stroke="#d97706" stroke-width="2.5"/>
    <rect x="425" y="58" width="350" height="43" rx="16" fill="#fef3c7"/>
    <rect x="425" y="84" width="350" height="17" fill="#fef3c7"/>
    <rect x="805" y="58" width="350" height="158" rx="16" fill="#ffffff" stroke="#16a34a" stroke-width="2.5"/>
    <rect x="805" y="58" width="350" height="43" rx="16" fill="#dcfce7"/>
    <rect x="805" y="84" width="350" height="17" fill="#dcfce7"/>
  </g>
  <g class="head">
    <text x="220" y="86">① 导入与选取</text>
    <text x="600" y="86">② 分析与融合</text>
    <text x="980" y="86">③ 建书与回填</text>
  </g>
  <g class="body">
    <text x="220" y="127"><tspan x="220">TXT + 书名</tspan><tspan x="220" dy="23">自动分章</tspan><tspan x="220" dy="23">≤10 万字全量；大文本 7 + 7 + 10</tspan></text>
    <text x="600" y="121"><tspan x="600">分批分析 API</tspan><tspan x="600" dy="22">每批 ≤25 章，最多 3 批并发</tspan><tspan x="600" dy="22">JSON 校验 / 修复，融合资料</tspan></text>
    <text x="980" y="121"><tspan x="980">严格失败 → 妥协融合</tspan><tspan x="980" dy="22">自动创建新书并回填</tspan><tspan x="980" dy="22">原作独立保存，正文从第 1 章开始</tspan></text>
  </g>
</svg>
