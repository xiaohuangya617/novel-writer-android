<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-labelledby="title desc">
  <title id="title">走向创作链</title>
  <desc id="desc">点击走向，选择 H 或 X 策略，组装请求，调用走向 API，选择或修改候选走向，决定是否发送正文。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/></marker>
    <style>
      .label { font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; font-size: 16px; fill: #172033; text-anchor: middle; }
      .small { font-size: 14px; }
      .edge { stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
      .box { stroke-width: 2; rx: 12; }
    </style>
  </defs>
  <rect width="1200" height="250" fill="#ffffff"/>
  <g class="edge">
    <line x1="195" y1="125" x2="220" y2="125"/><line x1="385" y1="125" x2="410" y2="125"/>
    <line x1="575" y1="125" x2="600" y2="125"/><line x1="765" y1="125" x2="790" y2="125"/>
    <line x1="955" y1="125" x2="980" y2="125"/>
  </g>
  <g>
    <rect class="box" x="35" y="83" width="160" height="84" fill="#f3e8ff" stroke="#9333ea"/>
    <rect class="box" x="225" y="83" width="160" height="84" fill="#f3e8ff" stroke="#9333ea"/>
    <rect class="box" x="415" y="83" width="160" height="84" fill="#f3e8ff" stroke="#9333ea"/>
    <rect class="box" x="605" y="83" width="160" height="84" fill="#fef3c7" stroke="#d97706"/>
    <rect class="box" x="795" y="83" width="160" height="84" fill="#dcfce7" stroke="#16a34a"/>
    <rect class="box" x="985" y="83" width="160" height="84" fill="#f3e8ff" stroke="#9333ea"/>
  </g>
  <g class="label">
    <text x="115" y="118"><tspan x="115">① 点击“走向”</tspan></text>
    <text x="305" y="108"><tspan x="305">② 选择 H / X 策略</tspan><tspan class="small" x="305" dy="22">生成策略提示</tspan></text>
    <text x="495" y="108"><tspan x="495">③ 组装走向请求</tspan><tspan class="small" x="495" dy="22">资料 + 当前章节 + 禁用词</tspan></text>
    <text x="685" y="108"><tspan x="685">④ 走向 API</tspan><tspan class="small" x="685" dy="22">返回 3 条候选</tspan></text>
    <text x="875" y="108"><tspan x="875">⑤ 选择或修改</tspan><tspan class="small" x="875" dy="22">回填消息框</tspan></text>
    <text x="1065" y="108"><tspan x="1065">⑥ 用户决定</tspan><tspan class="small" x="1065" dy="22">是否发送正文</tspan></text>
  </g>
</svg>
