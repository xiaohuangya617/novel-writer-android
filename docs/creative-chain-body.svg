<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-labelledby="title desc">
  <title id="title">正文创作链</title>
  <desc id="desc">输入消息，组装正文请求，调用正文 API，保存章节，调用摘要与成长 API，回写资料并显示结果。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/></marker>
    <style>
      .label { font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; font-size: 16px; fill: #172033; text-anchor: middle; }
      .small { font-size: 14px; }
      .edge { stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
      .box { stroke-width: 2; rx: 12; }
    </style>
  </defs>
  <rect width="1200" height="250" fill="#ffffff"/>
  <g class="edge">
    <line x1="195" y1="125" x2="220" y2="125"/><line x1="385" y1="125" x2="410" y2="125"/>
    <line x1="575" y1="125" x2="600" y2="125"/><line x1="765" y1="125" x2="790" y2="125"/>
    <line x1="955" y1="125" x2="980" y2="125"/>
  </g>
  <g>
    <rect class="box" x="35" y="83" width="160" height="84" fill="#e0f2fe" stroke="#0284c7"/>
    <rect class="box" x="225" y="83" width="160" height="84" fill="#fef3c7" stroke="#d97706"/>
    <rect class="box" x="415" y="83" width="160" height="84" fill="#fef3c7" stroke="#d97706"/>
    <rect class="box" x="605" y="83" width="160" height="84" fill="#dcfce7" stroke="#16a34a"/>
    <rect class="box" x="795" y="83" width="160" height="84" fill="#fef3c7" stroke="#d97706"/>
    <rect class="box" x="985" y="83" width="160" height="84" fill="#dcfce7" stroke="#16a34a"/>
  </g>
  <g class="label">
    <text x="115" y="118"><tspan x="115">① 输入消息</tspan></text>
    <text x="305" y="108"><tspan x="305">② 组装请求</tspan><tspan class="small" x="305" dy="22">固定模板 + 书籍资料</tspan><tspan class="small" x="305" dy="20">摘要/成长 + 本次消息</tspan></text>
    <text x="495" y="108"><tspan x="495">③ 正文 API</tspan><tspan class="small" x="495" dy="22">返回 Markdown</tspan></text>
    <text x="685" y="118"><tspan x="685">④ 保存最新章节</tspan></text>
    <text x="875" y="108"><tspan x="875">⑤ 摘要与成长 API</tspan><tspan class="small" x="875" dy="22">独立请求</tspan></text>
    <text x="1065" y="108"><tspan x="1065">⑥ 回写资料</tspan><tspan class="small" x="1065" dy="22">显示结果</tspan></text>
  </g>
</svg>
