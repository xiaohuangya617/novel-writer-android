<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AI 小说 · 手机界面</title>
  <link rel="stylesheet" href="css/all.min.css">
  <style>
    :root{font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif;color:#182725;background:#e7ebe7;letter-spacing:0}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;height:100%}button,input,textarea,select{font:inherit;letter-spacing:0}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.46}
    .app{width:min(100%,440px);height:100dvh;min-height:0;margin:auto;display:flex;flex-direction:column;position:relative;overflow:hidden;background:#f8faf8;box-shadow:0 0 32px #1a292324}
    .topbar{height:62px;min-height:62px;background:#20322e;color:#f7faf7;display:flex;align-items:center;gap:6px;padding:0 13px;border-bottom:3px solid #c8894b;position:relative}
    .topbar .book-name{position:absolute;left:50%;transform:translateX(-50%);max-width:calc(100% - 218px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px;font-weight:750;text-align:center;color:#f7faf7;pointer-events:none}.topbar .icon-btn{width:48px;min-width:48px;height:48px}.topbar #archiveButton{margin-left:auto}
    .icon-btn{width:34px;height:34px;min-width:34px;border:0;background:transparent;color:inherit;border-radius:5px;display:grid;place-items:center;font-size:17px}
    .icon-btn:hover,.icon-btn:focus-visible{background:#ffffff24;outline:none}.workspace{flex:1;min-height:0;display:grid;grid-template-columns:128px minmax(0,1fr)}
    .app.rail-compact .workspace{grid-template-columns:64px minmax(0,1fr)}
    .rail{min-height:0;background:#edf1ec;border-right:1px solid #d4ddd6;display:flex;flex-direction:column}
    .app.reader-focus .workspace{grid-template-columns:minmax(0,1fr)}.app.reader-focus .rail{display:none}
    .rail-section{min-height:0;display:flex;flex-direction:column}.rail-section.books{height:40%;border-bottom:1px solid #cfdad2}.rail-section.chapters{flex:1}
    .rail-head{height:48px;min-height:48px;padding:0 0 0 10px;display:flex;align-items:center;justify-content:space-between;color:#566660;font-size:11px;font-weight:750}
    .rail-scroll{overflow-y:auto;min-height:0;padding:0 5px 8px}

    .book-row{min-height:55px;padding:6px 5px}.book-row.active,.chapter-row.active{background:#dcebe3;border-color:#b3d0c0;color:#145641}
    .book-spine{width:5px;align-self:stretch;min-height:32px;border-radius:2px;background:#c9874d;flex:none}.book-row:nth-child(2n) .book-spine{background:#638a93}
    .book-meta{min-width:0;min-height:48px;flex:1;display:flex;flex-direction:column;justify-content:center}.book-title{font-size:11px;font-weight:750;line-height:1.3;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.book-count{font-size:10px;color:#778a81;margin-top:3px}
    .chapter-row{min-height:48px;padding:6px 4px;line-height:1.3;gap:3px;white-space:nowrap;overflow:hidden}.chapter-no{font-size:10px;color:#83928a;flex:none}.chapter-title{min-width:0;font-size:10px;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .rail-compact .rail-head{padding-left:6px}.rail-compact .rail-scroll{padding:0 3px 8px}.rail-compact .book-row{min-height:48px;padding:3px;gap:3px}.rail-compact .book-spine{width:4px;min-height:28px}.rail-compact .book-meta{min-height:40px}.rail-compact .book-title{font-size:10px;white-space:nowrap;display:block;overflow:hidden;text-overflow:ellipsis}.rail-compact .book-count,.rail-compact .chapter-title{display:none}.rail-compact .chapter-row{padding:6px 3px}
    .empty-rail{padding:10px 5px;font-size:11px;line-height:1.5;color:#8b9992}
    .main{min-width:0;min-height:0;display:flex;flex-direction:column;background:#fff;position:relative}.tabs{height:49px;min-height:49px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-bottom:1px solid #e1e9e3;background:#fafcf9}.reader-scrollbar{position:absolute;top:49px;right:0;bottom:0;width:4px;background:#e4ebe5;z-index:2;pointer-events:none}.reader-scrollbar-thumb{position:absolute;left:0;right:0;min-height:24px;background:#6e9d7f;border-radius:3px}

    .tab i{font-size:14px}.tab.active{color:#11664c}.tab.active:after{content:"";position:absolute;bottom:0;height:3px;width:38px;max-width:80%;background:#138060;border-radius:2px 2px 0 0}
    .panel{flex:1;min-height:0;overflow-y:auto}.panel.reader-continuous{scrollbar-gutter:stable;scrollbar-width:thin;scrollbar-color:#8eaa97 #f2f5f1}.panel.reader-continuous::-webkit-scrollbar{width:6px}.panel.reader-continuous::-webkit-scrollbar-track{background:#f2f5f1}.panel.reader-continuous::-webkit-scrollbar-thumb{background:#8eaa97;border-radius:3px}.panel-header{padding:15px 14px 10px;border-bottom:1px solid #e5ebe6}.eyebrow{font-size:10px;font-weight:750;color:#b67943}.panel-header h1{font-size:18px;line-height:1.3;margin:3px 0 5px;overflow-wrap:anywhere}.subtle{font-size:11px;color:#7b8c81;line-height:1.5}
    .messages{display:flex;flex-direction:column;min-height:100%;padding:12px 12px 18px;gap:11px}.message{max-width:95%;font-size:12px;line-height:1.65;border-radius:6px;padding:10px 11px;white-space:pre-wrap;overflow-wrap:anywhere}.message:not(.pending){font-size:var(--message-font-size,16px)}

    .composer textarea:focus,.field:focus{border-color:#238764;box-shadow:0 0 0 2px #23876418}.composer.is-busy{background:#e9eeea}.composer textarea:disabled{background:#e1e7e2;border-color:#bfcac2;color:#536259;-webkit-text-fill-color:#536259;opacity:1;cursor:wait}.composer-actions{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;margin-top:7px}.composer-actions .btn{width:100%;min-width:0;padding:0 2px;gap:4px}
    @container (max-width: 305px){.composer-actions .btn span{display:none}.composer-actions .btn{font-size:16px}}
    .btn{height:48px;min-height:48px;border:1px solid #c6d4c9;background:#fff;border-radius:5px;padding:0 10px;color:#2d5c49;font-size:11px;font-weight:750;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
    .btn.primary{background:#136d51;border-color:#136d51;color:#fff}.btn.warn{color:#a94e40;border-color:#e4c4bd}.btn.danger{background:#b43e37;border-color:#b43e37;color:#fff}.btn.wide{width:100%}.btn:focus-visible,.row-more:focus-visible,.book-row:focus-visible,.chapter-row:focus-visible,.tab:focus-visible{outline:2px solid #158163;outline-offset:1px}
    .reader-toolbar{position:sticky;top:0;z-index:1;height:58px;padding:5px 10px 5px 14px;display:flex;align-items:center;gap:4px;background:#fff;border-bottom:1px solid #e5ebe6}.reader-position{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.reader-toolbar .icon-btn{color:#49725c;width:48px;min-width:48px;height:48px}.reader-toolbar .icon-btn[aria-pressed="true"]{background:#e5f3ec;color:#136d51}.reader{padding:15px 14px 35px}.reader-stream .reader{border-bottom:1px solid #dfe8df}.reader-stream .reader:last-child{min-height:calc(100dvh - 169px)}.reader h1{font-size:19px;line-height:1.4;margin:5px 0 8px}.reader-meta{font-size:10px;color:#819087;padding-bottom:15px;border-bottom:1px solid #e5ebe6}.summary{padding:11px 12px;background:#f2f5ef;border-left:3px solid #c68a52;margin:16px 0 20px;font-size:11px;line-height:1.7;color:#4b5d50}.summary strong{display:block;color:#6c593c;font-size:11px;margin-bottom:2px}.prose{font-size:var(--reader-font-size,20px);line-height:1.9;color:#28352e;overflow-wrap:anywhere}.prose p{margin:0 0 1em}.prose h1,.prose h2,.prose h3{font-size:1.15em;margin:1.3em 0 .6em}.prose blockquote{margin:1em 0;padding-left:12px;border-left:3px solid #a6bbac;color:#52685b}.prose pre{overflow-x:auto;padding:10px;background:#f2f5f1}.prose code{white-space:pre-wrap}.prose a{color:#136d51}
    .form-view{padding:14px}.form-view h1{font-size:18px;margin:0 0 4px}.form-intro{font-size:11px;color:#809085;margin:0 0 16px}.form-group{margin-bottom:15px}.form-label{display:block;font-size:11px;color:#44574a;font-weight:750;margin-bottom:6px}.field{width:100%;border:1px solid #ccd9cf;border-radius:5px;padding:9px 10px;background:#fff;color:#20332a;font-size:12px;outline:none}.form-view textarea.field{height:clamp(210px,28dvh,320px);min-height:210px;max-width:100%;resize:vertical;line-height:1.6}
    .form-footer{position:sticky;bottom:0;background:#fff;padding:10px 0 3px;display:flex;align-items:center;justify-content:space-between;gap:8px}.save-status{font-size:11px;color:#68816e;white-space:nowrap}
    .drawer-backdrop,.sheet-backdrop{position:absolute;inset:0;background:#101c17a8;z-index:20}.drawer{height:100%;width:min(78%,286px);overflow-y:auto;background:#f9fbf8;box-shadow:5px 0 22px #17291d30;display:flex;flex-direction:column}
    .drawer-head{height:67px;background:#20322e;color:#fff;padding:10px 16px;display:flex;align-items:center;justify-content:space-between}.drawer-head strong{font-size:16px}.drawer-head .icon-btn{width:48px;min-width:48px;height:48px}.drawer-group{padding:12px 9px 6px}.drawer-label{font-size:10px;color:#91a095;text-transform:uppercase;font-weight:800;padding:0 9px 7px}.drawer-item{display:flex;gap:12px;width:100%;height:48px;align-items:center;border:0;background:transparent;border-radius:5px;color:#34463a;text-align:left;padding:0 12px;font-size:13px;font-weight:650}.drawer-item:hover{background:#e8f1e9}.drawer-item i{width:18px;text-align:center;color:#43715a}.drawer-sep{border-top:1px solid #e0e8e0;margin:6px 15px}.drawer-foot{margin-top:auto;padding:14px;color:#8a998e;font-size:10px}
    .sheet-backdrop{z-index:30;display:flex;align-items:flex-end}.sheet{width:100%;max-height:88%;overflow-y:auto;background:#fff;border-radius:8px 8px 0 0;box-shadow:0 -7px 24px #12221930;padding-bottom:max(20px,env(safe-area-inset-bottom))}
    .discard-backdrop{position:absolute;inset:0;z-index:35;background:#101c17b8;display:flex;align-items:flex-end}.discard-dialog{width:100%;background:#fff;border-radius:8px 8px 0 0;padding:18px 16px max(20px,env(safe-area-inset-bottom))}.discard-dialog h2{font-size:16px;margin:0 0 10px}
    .sheet-head{height:57px;display:flex;align-items:center;padding:0 10px 0 16px;border-bottom:1px solid #e6ece6;position:sticky;top:0;background:#fff;z-index:1}.sheet-head h2{font-size:16px;margin:0;flex:1}.sheet-body{padding:16px}.sheet .icon-btn{color:#627268;width:48px;min-width:48px;height:48px}.sheet .icon-btn:hover{background:#eaf1eb}
    .sheet-list{display:grid;gap:8px}.sheet-row{border:1px solid #e0e7e0;border-radius:6px;padding:10px 11px;background:#fbfcfa}.sheet-row strong{font-size:12px;display:block;line-height:1.4}.sheet-row small{font-size:11px;color:#788a7c;line-height:1.5;display:block;margin-top:3px}.sheet-row .row-actions{display:flex;gap:6px;margin-top:10px}.sheet-row.library-row{display:flex;align-items:center;gap:8px;height:78px;min-height:78px;max-height:78px;overflow:hidden}.library-row .row-info{min-width:0;flex:1}.library-row .row-info strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.library-row .row-info small{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}.library-row .icon-btn{width:48px;min-width:48px;height:48px;color:#ae4a40}
    .sheet-form .form-group{margin-bottom:13px}.sheet-form textarea.field{min-height:80px;resize:vertical}.sheet-actions{display:flex;gap:8px;margin-top:14px}.sheet-actions .btn{flex:1}.mini-note{font-size:11px;color:#7d8d81;line-height:1.6;margin:0 0 12px}.font-size-control{display:flex;align-items:center;gap:12px}.font-size-control input{flex:1;min-width:0;accent-color:#136d51}.font-size-control output{width:44px;text-align:right;font-size:14px;font-weight:750;color:#245b44}
    .help-copy{font-size:12px;line-height:1.7;color:#31463d}.help-copy p{margin:0 0 12px}.help-copy p:last-child{margin-bottom:0}.help-copy strong{color:#176449}.version-repo a{color:#136d51;overflow-wrap:anywhere}.update-panel{border-top:1px solid #e1e9e2;padding-top:14px;margin-top:14px}.update-heading{font-size:13px;font-weight:750;color:#245b44;margin:0 0 8px}.update-notes{font-size:11px;line-height:1.6;color:#4b5d50;white-space:pre-wrap;overflow-wrap:anywhere;max-height:180px;overflow-y:auto;margin:8px 0 12px}.update-progress{width:100%;height:10px;accent-color:#136d51;margin:6px 0 10px}.update-panel .sheet-actions{margin-top:10px}
    .choice{width:100%;height:148px;min-height:148px;max-height:148px;padding:11px 14px;text-align:left;border:1px solid #cfded3;border-radius:6px;background:#fff;margin-bottom:9px;display:flex;flex-direction:column;overflow:hidden}.choice strong{font-size:13px;color:#275b46;line-height:1.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.choice span{display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;font-size:11px;line-height:1.6;color:#697c6f;margin-top:5px;white-space:pre-line;overflow-wrap:anywhere}
    .growth-card{margin:0;padding:0;overflow:hidden}.growth-card:not([open]){height:78px;min-height:78px;max-height:78px}.growth-card summary{height:76px;padding:9px 11px;display:flex;flex-direction:column;gap:5px;list-style:none}.growth-card summary::-webkit-details-marker{display:none}.growth-heading{display:flex;align-items:center;gap:6px;min-width:0;height:18px;flex:none}.growth-heading strong{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.growth-count,.growth-latest{font-size:10px;color:#75877a;font-weight:500;white-space:nowrap;flex:none}.growth-heading i{color:#698474;font-size:12px;flex:none}.growth-card[open] .growth-heading i{transform:rotate(180deg)}.growth-preview{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:11px;line-height:1.55;color:#4b5d50;white-space:pre-line;overflow-wrap:anywhere}.growth-history{border-top:1px solid #e0e7e0;padding:4px 12px 10px}.growth-entry{padding:9px 0;border-bottom:1px solid #e9eee9;font-size:11px;line-height:1.6;color:#4b5d50;white-space:pre-wrap;overflow-wrap:anywhere}.growth-entry:last-child{border-bottom:0}
    .library-row [data-edit-role],.library-row [data-edit-action]{color:#49725c}
    details{border:1px solid #e1e9e2;border-radius:5px;padding:10px;margin-top:12px}summary{font-size:12px;font-weight:750;color:#3d5b4b;cursor:pointer}details .form-group:first-of-type{margin-top:13px}
    .toast{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);width:max-content;max-width:calc(100% - 32px);z-index:50;border-radius:5px;background:#20352c;color:#fff;padding:9px 13px;font-size:11px;line-height:1.4;box-shadow:0 5px 22px #14251e44;text-align:center}
    .storage-error{background:#fff0ed;color:#9d312e;padding:7px 12px;font-size:11px;line-height:1.5}

    [hidden]{display:none!important}
    @media(max-width:359px){.workspace{grid-template-columns:80px minmax(0,1fr)}.app.rail-compact .workspace{grid-template-columns:64px minmax(0,1fr)}.book-row{min-height:55px;padding:5px 3px;gap:3px}.book-row .book-title{font-size:10px}.book-count,.chapter-title{display:none}.tab{font-size:10px}.tab i{font-size:13px}}

<body>
  <div class="app" id="app">
    <header class="topbar">
      <button class="icon-btn" id="menuButton" aria-label="打开菜单" title="菜单"><i class="fa-solid fa-bars"></i></button>
      <button class="icon-btn" id="railToggleButton" aria-label="压缩书架和章节" title="压缩书架和章节" aria-pressed="false"><i class="fa-solid fa-angles-left"></i></button>
      <span class="book-name" id="topBookName"></span>
      <button class="icon-btn" id="archiveButton" aria-label="存档" title="存档"><i class="fa-solid fa-box-archive"></i></button>
    </header>
    <div class="storage-error" id="storageError" role="alert" hidden>保存失败。请保持应用打开，并导出项目存档。</div>
    <div class="workspace">
      <aside class="rail" aria-label="作品和章节">
        <section class="rail-section books"><div class="rail-head"><span>书架</span></div><div class="rail-scroll" id="booksList"></div></section>
        <section class="rail-section chapters"><div class="rail-head"><span>章节</span></div><div class="rail-scroll" id="chaptersList"></div></section>
      </aside>
      <main class="main">
        <nav class="tabs" aria-label="主视图">
          <button class="tab active" data-tab="messages"><i class="fa-regular fa-comment-dots"></i><span>消息</span></button>
          <button class="tab" data-tab="reader"><i class="fa-solid fa-book-open"></i><span>正文</span></button>
          <button class="tab" data-tab="world"><i class="fa-solid fa-globe"></i><span>设定</span></button>
          <button class="tab" data-tab="prompt"><i class="fa-solid fa-sliders"></i><span>提示</span></button>
        </nav>
        <div class="panel" id="panel"></div>
        <div class="reader-scrollbar" id="readerScrollbar" aria-hidden="true" hidden><div class="reader-scrollbar-thumb" id="readerScrollbarThumb"></div></div>
        <div class="composer" id="composer"><textarea id="instruction" aria-label="创作指令" placeholder="写下这章要发生的事…"></textarea><div class="composer-actions"><button class="btn" id="continueButton" aria-label="续写" title="续写"><i class="fa-solid fa-arrow-right"></i><span>续写</span></button><button class="btn" id="refillButton" aria-label="回填上次消息" title="回填上次消息"><i class="fa-solid fa-rotate-left"></i><span>回填</span></button><button class="btn" id="clearButton" aria-label="清空编辑框" title="清空编辑框"><i class="fa-solid fa-eraser"></i><span>清空</span></button><button class="btn warn" id="stopButton" aria-label="停止生成" title="停止生成" disabled><i class="fa-solid fa-stop"></i><span>停止</span></button><button class="btn primary" id="newChapterButton" aria-label="发送消息" title="发送消息"><i class="fa-solid fa-paper-plane"></i><span>发送</span></button></div></div>
      </main>
    </div>
    <div class="drawer-backdrop" id="drawerBackdrop" hidden><aside class="drawer" role="navigation" aria-label="功能菜单"><div class="drawer-head"><strong>工作台</strong><button class="icon-btn" id="closeDrawer" aria-label="关闭菜单" title="关闭"><i class="fa-solid fa-xmark"></i></button></div><div class="drawer-group"><button class="drawer-item" data-sheet="books"><i class="fa-solid fa-book"></i> 书架管理</button><button class="drawer-item" data-sheet="actions"><i class="fa-solid fa-person-running"></i> 全局设定库</button><button class="drawer-item" data-sheet="globalRoles"><i class="fa-solid fa-address-card"></i> 全局角色库</button><button class="drawer-item" data-sheet="roles"><i class="fa-solid fa-users"></i> 本书角色库</button><button class="drawer-item" data-sheet="growth"><i class="fa-solid fa-seedling"></i> 本书角色成长</button></div><div class="drawer-sep"></div><div class="drawer-group"><button class="drawer-item" data-sheet="api"><i class="fa-solid fa-sliders"></i> AI设置</button><button class="drawer-item" data-sheet="fontSize"><i class="fa-solid fa-text-height"></i> 正文字号</button><button class="drawer-item" data-sheet="messageFontSize"><i class="fa-solid fa-font"></i> 消息字号</button></div><div class="drawer-sep"></div><div class="drawer-group"><button class="drawer-item" data-sheet="help"><i class="fa-solid fa-circle-question"></i> 使用说明</button><button class="drawer-item" data-sheet="version"><i class="fa-solid fa-circle-info"></i> 当前版本</button></div><div class="drawer-foot">AI 小说 · 移动创作</div></aside></div>

        {id:'book-fog',name:'雾港纪事',currentChapterId:'fog-3',worldview:'雾港依山临海，每逢涨潮，旧城的钟楼会比港口报时慢七分钟。港务局封存了二十年前的航行记录。',plotSet:'林澈追查父亲失踪的航线，从钟楼异常、旧船员名单和潮汐记录中拼出同一夜发生的事。',globalPrompt:'你是一位擅长悬疑长篇的小说作者。保持线索可追溯，人物行为要有清晰动机。',writingStyle:'语言克制，场景具体。每章推进一个新线索，结尾留下自然的悬念。',characters:[{id:'char-lin',name:'林澈',appearance:'二十七岁，左眉有浅疤。',personality:'谨慎，擅长记住声音和时间。',special:'曾在港务局做档案员。',relationship:'林远之子。',growth:[{chapterId:'fog-2',chapNo:2,text:'发现父亲失踪前曾主动修改航线记录，不再完全相信旧档案。'},{chapterId:'fog-3',chapNo:3,text:'第一次主动向港务局内部人求助。'}]},{id:'char-su',name:'苏晚',appearance:'常穿深色雨衣。',personality:'直率，习惯先行动再解释。',special:'港口无线电维修员。',relationship:'林澈的旧友。',growth:[{chapterId:'fog-3',chapNo:3,text:'决定将私藏的旧频段录音交给林澈。'}]}],chapters:[
          {id:'fog-1',title:'雨中的钟声',content:'雨落到港口的时候，钟楼刚敲过九下。\n\n林澈看了眼腕表，指针才走到八点五十三分。街边的报刊亭已经打烊，只有海事局那面旧公告牌还亮着一盏灯。\n\n他把父亲留下的航行记录从衣袋里取出来。纸角被潮气浸软，最后一页却格外干净，像有人在那天夜里重新换过。',summary:'林澈回到雾港，发现钟楼报时与实际时间相差七分钟，并察觉父亲留下的航行记录被人动过。',savedAt:Date.now()-3*86400000,checkResult:[]},

        {id:'book-star',name:'星屿来信',currentChapterId:'star-2',worldview:'星屿群岛靠信鸥传递纸质信件，岛与岛之间的航班每周只有两次。',plotSet:'许遥寻找一封没有寄件人的来信，逐步揭开母亲年轻时离开星屿的原因。',globalPrompt:'你是一位擅长人物关系与日常叙事的作者。',writingStyle:'明亮、节制，重视日常细节。',characters:[{id:'char-xu',name:'许遥',appearance:'短发，喜欢背帆布包。',personality:'温和但固执。',special:'在星屿邮局工作。',relationship:'母亲曾在主岛生活。',growth:[]}],chapters:[{id:'star-1',title:'没有署名的信',content:'海风把信封吹到了柜台边。\n\n许遥伸手按住它，才发现封口没有盖章。',summary:'许遥在邮局收到一封没有寄件人的信。',savedAt:Date.now()-2*86400000,checkResult:[]},{id:'star-2',title:'南岸渡船',content:'清晨的渡船上，许遥把那封信放在膝头。\n\n她没有拆开，因为信封上的笔迹让她想起了母亲。',summary:'许遥带着来信登上南岸渡船，认出信封上熟悉的笔迹。',savedAt:Date.now()-86400000,checkResult:[]}],chatHistory:[{role:'assistant',content:'《星屿来信》已打开。',ts:Date.now()-30000}]}
      ],
      actions:[{id:'action-search',name:'翻查旧档',keyPoints:'先确认档案编号与日期，再对照涂改痕迹。',linesUsage:'避免角色直接得出结论，让发现逐步推进。',descriptionTips:'写出纸张、印章和保存环境的细节。'},{id:'action-listen',name:'辨认录音',keyPoints:'先听背景噪声，再确认语音中的时间与地点。',linesUsage:'台词保留不确定感。',descriptionTips:'用停顿和杂音制造信息缺口。'}],
      activeBookId:'book-fog',selectedChapterId:'fog-3',activeTab:'messages',apiConfig:{url:'https://api.deepseek.com/chat/completions',model:'deepseek-flash',temperature:'1.0',topP:'0.92',presence:'0.5',frequency:'0.4',repetition:'1.15',maxTokens:'60000',ctxChapters:'5',stopWords:'',thinking:false,reasoning:'high'}
    };
    const nativeHost=typeof AndroidBridge!=='undefined';
    const defaultAuthorPrompt='你是一位经验丰富的长篇小说作家。请根据本书设定、角色资料、既有章节和本次创作指令写作。保持人物性格、身份、关系与成长经历前后一致，让行动源于明确动机，情节变化有铺垫和因果。优先呈现具体场景、可感知的细节与有目的的对话，少用空泛总结和重复解释。每章应推进人物关系或主线，并自然承接前文；当资料冲突时，以本次用户指令和最新成长状态为准。直接输出可阅读的小说正文，不解释写作过程。';
    const DEFAULT_READER_FONT_SIZE=20,DEFAULT_MESSAGE_FONT_SIZE=16;
    const fontSize=(value,fallback)=>Number.isInteger(value)&&value>=12&&value<=30?value:fallback;
    const emptyState=()=>({books:[],actions:[],globalCharacters:[],readerFontSize:DEFAULT_READER_FONT_SIZE,messageFontSize:DEFAULT_MESSAGE_FONT_SIZE,activeBookId:null,selectedChapterId:null,activeTab:'messages',apiConfig:structuredClone(seed.apiConfig),railCompact:false,readerContinuous:false});
    const record=value=>value!==null&&typeof value==='object'&&!Array.isArray(value);
    function validLibrary(books,actions,globalCharacters=[]){
      if(!Array.isArray(books)||!Array.isArray(actions)||!Array.isArray(globalCharacters))return false;
      if(new Set(books.map(b=>b?.id)).size!==books.length||new Set(actions.map(a=>a?.id)).size!==actions.length||new Set(globalCharacters.map(c=>c?.id)).size!==globalCharacters.length)return false;
      if(actions.some(a=>!record(a)||typeof a.id!=='string'||!a.id||typeof a.name!=='string'||['keyPoints','linesUsage','descriptionTips'].some(k=>a[k]!=null&&typeof a[k]!=='string')))return false;
      if(globalCharacters.some(c=>!record(c)||typeof c.id!=='string'||!c.id||typeof c.name!=='string'||!c.name.trim()||['appearance','personality','special','relationship'].some(k=>c[k]!=null&&typeof c[k]!=='string')||(c.tags!=null&&(!Array.isArray(c.tags)||c.tags.some(t=>typeof t!=='string')))||(c.relationships!=null&&!Array.isArray(c.relationships))))return false;
      return books.every(b=>record(b)&&typeof b.id==='string'&&!!b.id&&typeof b.name==='string'&&Array.isArray(b.chapters)&&Array.isArray(b.characters)&&(b.chatHistory==null||Array.isArray(b.chatHistory))&&
        ['worldview','plotSet','globalPrompt','writingStyle','draft','pendingInstruction'].every(k=>b[k]==null||typeof b[k]==='string')&&
        new Set(b.chapters.map(c=>c?.id)).size===b.chapters.length&&new Set(b.characters.map(c=>c?.id)).size===b.characters.length&&
        b.chapters.every(c=>record(c)&&typeof c.id==='string'&&!!c.id&&typeof c.content==='string'&&['title','summary','prompt'].every(k=>c[k]==null||typeof c[k]==='string'))&&
        b.characters.every(c=>record(c)&&typeof c.id==='string'&&!!c.id&&typeof c.name==='string'&&(c.growth==null||Array.isArray(c.growth)&&c.growth.every(g=>record(g)&&typeof g.text==='string'&&(g.chapterId==null||typeof g.chapterId==='string')&&(g.chapNo==null||Number.isFinite(Number(g.chapNo))))))&&
        (b.chatHistory||[]).every(m=>record(m)&&(m.role==='user'||m.role==='assistant')&&typeof m.content==='string'&&(m.retry==null||typeof m.retry==='string')&&(m.costLabel==null||typeof m.costLabel==='string')));
    }
    let state,storageDamaged=false,settingsDamaged=false,projectSaveFailed=false;
    try {
      const raw=nativeHost?AndroidBridge.loadProject():localStorage.getItem('novel_mobile_ui_demo_v1');
      const saved=raw?JSON.parse(raw):null;
      if((!raw&&nativeHost&&AndroidBridge.hasProject())||(raw&&(!record(saved)||!validLibrary(saved.books,saved.actions,saved.globalCharacters===undefined?[]:saved.globalCharacters))))throw Error('存档结构无效');
      state=saved||emptyState();
      state.globalCharacters ||= [];
      state.readerFontSize=fontSize(state.readerFontSize,DEFAULT_READER_FONT_SIZE);
      state.messageFontSize=fontSize(state.messageFontSize,DEFAULT_MESSAGE_FONT_SIZE);
      state.readerContinuous=false;
    }catch(e){state=emptyState();storageDamaged=true}
    $('app').style.setProperty('--reader-font-size',`${state.readerFontSize}px`);
    $('app').style.setProperty('--message-font-size',`${state.messageFontSize}px`);
    let apiKey='';
    try{const settings=nativeHost?AndroidBridge.loadApiSettings(JSON.stringify(state.apiConfig||seed.apiConfig)):localStorage.getItem('novel_mobile_api_settings_v1');
      if(nativeHost&&!settings)throw Error('AI 设置无法读取');
      if(settings){const saved=JSON.parse(settings);if(!record(saved)||typeof saved.key!=='string'||typeof saved.url!=='string'||typeof saved.model!=='string')throw Error('AI 设置结构无效');apiKey=saved.key;delete saved.key;state.apiConfig=saved}
      else apiKey=localStorage.getItem('novel_mobile_ui_demo_key')||'';
    }catch(e){settingsDamaged=true}
    function normalizeBooks(books){for(const item of books){
      item.chatHistory ||= [];
      if(item.pendingSummaryChapterId){const pending=item.chapters?.find(ch=>ch.id===item.pendingSummaryChapterId);if(pending&&!pending.summary){pending.pendingSummary=true;pending.pendingSummaryUsage=item.pendingSummaryUsage||null}delete item.pendingSummaryChapterId;delete item.pendingSummaryUsage}
      for(const pending of item.chapters||[]){if(!pending.pendingSummary||pending.summary)continue;if(nativeHost&&state.pendingNativeTask?.bookId===item.id&&state.pendingNativeTask?.phase==='summary'&&state.pendingNativeTask?.chapterId===pending.id)continue;const retry=`summary:${pending.id}`;const legacy=item.chatHistory.find(message=>message.retry==='summary');if(legacy)legacy.retry=retry;if(!item.chatHistory.some(message=>message.retry===retry))item.chatHistory.push({role:'assistant',content:'上次资料整理未完成，正文仍已保存。',error:true,retry,ts:Date.now()})}
      if(item.pendingInstruction&&!(nativeHost&&state.pendingNativeTask?.bookId===item.id&&state.pendingNativeTask?.phase==='chapter')&&!item.chatHistory.some(message=>message.retry==='chapter'))item.chatHistory.push({role:'assistant',content:'上次正文请求未完成，创作指令已保留。',error:true,retry:'chapter',ts:Date.now()});
    }}
    normalizeBooks(state.books);
    let activeTask=null,readerWindow=null,readerLoadToken=0,readerLoading=false,readerBatchPending=false;
    let toastTimer;
    const book=()=>state.books.find(item=>item.id===state.activeBookId) || state.books[0];
    const chapter=()=>book()?.chapters?.find(item=>item.id===state.selectedChapterId) || book()?.chapters?.at(-1);
    function latestUserMessage(current){const history=current?.chatHistory||[];for(let i=history.length-1;i>=0;i--)if(history[i].role==='user')return history[i];return null}
    function updateStorageError(){const error=$('storageError');error.textContent=storageDamaged?'本地项目文件无法读取。请先恢复自己的存档，当前资料不会被覆盖。':projectSaveFailed?'项目保存失败。请保持应用打开，并导出项目存档。':'AI 设置无法读取或保存。请重新保存 AI 设置。';error.hidden=!(storageDamaged||projectSaveFailed||settingsDamaged)}
    function saveState(){if(storageDamaged){updateStorageError();return false}try{const json=JSON.stringify({...state,readerContinuous:false});const okay=nativeHost?AndroidBridge.saveProject(json):(localStorage.setItem('novel_mobile_ui_demo_v1',json),true);projectSaveFailed=!okay;updateStorageError();return okay}catch(e){projectSaveFailed=true;updateStorageError();return false}}
    function commitEdit(apply,rollback){apply();if(saveState())return true;rollback();notify('保存失败，修改未生效');return false}
    function saveApiSettings(cfg){try{const json=JSON.stringify(cfg);const okay=nativeHost?AndroidBridge.saveApiSettings(json):(localStorage.setItem('novel_mobile_api_settings_v1',json),true);settingsDamaged=!okay;updateStorageError();return okay}catch(e){settingsDamaged=true;updateStorageError();return false}}
    let saveTimer;
    function scheduleSave(){clearTimeout(saveTimer);saveTimer=setTimeout(saveState,300)}
    document.addEventListener('visibilitychange',()=>{if(document.hidden){clearTimeout(saveTimer);saveState()}});
    updateStorageError();
    function busy(){return !!activeTask}
    function guardBusy(){if(!busy())return false;notify('AI 正在处理，请等待或点击停止');return true}
    function notify(message){const el=$('toast');el.textContent=message;el.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.hidden=true,2600)}
    function renderRail(){
      const current=book();if(!current){$('topBookName').textContent='';$('topBookName').title='';$('booksList').innerHTML='<div class="empty-rail">暂无作品</div>';$('chaptersList').innerHTML='<div class="empty-rail">暂无章节</div>';return}
      $('topBookName').textContent=current.name;
      $('topBookName').title=current.name;
      $('booksList').innerHTML=state.books.map(item=>{const chars=Array.from(item.name);const name=state.railCompact&&chars.length>3?chars.slice(0,3).join('')+'...':item.name;return `<div class="book-row ${item.id===current.id?'active':''}" data-book="${esc(item.id)}"><span class="book-spine"></span><button class="book-meta" data-select-book="${esc(item.id)}" aria-label="${esc(item.name)}" title="${esc(item.name)}" style="border:0;background:none;padding:0;text-align:left;color:inherit"><span class="book-title">${esc(name)}</span><span class="book-count">${item.chapters?.length||0} 章</span></button></div>`}).join('');
      const chapters=Array.isArray(current.chapters)?current.chapters:[];
      const chapterList=$('chaptersList'),previousScroll=chapterList.scrollTop;
      chapterList.innerHTML=chapters.length?chapters.map((item,index)=>{const title=shortChapterTitle(item.title);const chars=Array.from(title);const shortTitle=chars.length>5?chars.slice(0,5).join('')+'...':title;return `<button class="chapter-row ${item.id===chapter()?.id?'active':''}" data-chapter="${esc(item.id)}" title="第 ${index+1} 章 ${esc(title)}" aria-label="第 ${index+1} 章 ${esc(title)}"><span class="chapter-no">${state.railCompact?`第${index+1}章`:`第 ${index+1} 章`}</span><span class="chapter-title">${esc(shortTitle)}</span></button>`}).join(''):'<div class="empty-rail">暂无章节</div>';
      chapterList.scrollTop=previousScroll;
      requestAnimationFrame(()=>{const list=$('chaptersList'),selected=list.querySelector('.chapter-row.active');if(!selected||!list.clientHeight)return;const viewport=list.getBoundingClientRect(),item=selected.getBoundingClientRect();if(item.top<viewport.top)list.scrollTop-=viewport.top-item.top;else if(item.bottom>viewport.bottom)list.scrollTop+=item.bottom-viewport.bottom});
      $('booksList').querySelectorAll('[data-select-book]').forEach(el=>el.onclick=()=>{if(guardBusy())return;state.activeBookId=el.dataset.selectBook;state.selectedChapterId=book()?.chapters?.at(-1)?.id||null;saveState();render()});
      $('chaptersList').querySelectorAll('[data-chapter]').forEach(el=>el.onclick=()=>{if(guardBusy())return;state.selectedChapterId=el.dataset.chapter;state.activeTab='reader';saveState();render()});
    }
    function renderMessages(){const current=book();const entries=Array.isArray(current.chatHistory)?current.chatHistory:[];const pending=activeTask?.bookId===current.id?`<div class="message assistant pending" role="status"><i class="fa-solid fa-spinner fa-spin"></i>${esc(activeTask.label)}</div>`:'';return `<div class="panel-header"><div class="eyebrow">当前作品</div><h1>${esc(current.name)}</h1><div class="subtle">${current.chapters?.length||0} 章 · 最新：${esc(current.chapters?.at(-1)?.title||'尚未生成')}</div></div><div class="messages" id="messageList">${entries.map(item=>`<div class="message ${item.role==='user'?'user':'assistant'} ${item.error?'error':''}">${esc(item.content)}${item.costLabel?`<span class="msg-meta">${esc(item.costLabel)}</span>`:''}${item.retry?`<button class="btn retry-btn" data-retry="${esc(item.retry)}"><i class="fa-solid fa-rotate-right"></i> 重试</button>`:''}</div>`).join('')}${pending}</div>`}

      $('exportProject').onclick=()=>{if(nativeHost)AndroidBridge.exportProject(JSON.stringify(backupObject()));else{downloadFile(backupFile());notify('App 项目存档已导出')}};
      $('exportBookText').onclick=()=>{const current=book();if(!current?.chapters?.length)return;const content=bookText(current);if(nativeHost)AndroidBridge.exportBookText(content,current.name);else{downloadFile(new File([content],`${current.name}_正文.txt`,{type:'text/plain;charset=utf-8'}));notify('本书正文已导出')}};
      async function shareBackup(format){if(nativeHost){if(format==='HTML')AndroidBridge.shareHtmlProject(JSON.stringify(htmlBackupObject()));else AndroidBridge.shareProject(JSON.stringify(backupObject()));return}const file=backupFile(format);if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:`小说项目存档（${format}）`});notify('已打开系统分享')}catch(e){if(e.name!=='AbortError')notify('分享未完成')}}else{downloadFile(file);notify('当前浏览器已改为下载存档')}}
      $('shareProject').onclick=()=>shareBackup('App');
      $('shareHtmlProject').onclick=()=>shareBackup('HTML');
      $('restoreFile').onchange=async e=>{if(nativeHost)return;const file=e.target.files?.[0];if(!file)return;try{restoreProject(JSON.parse(await file.text()))}catch(err){notify(err.message||'无法读取此存档')}};
      if(nativeHost)$('restoreFile').previousElementSibling.onclick=e=>{e.preventDefault();AndroidBridge.chooseProject()};
      $('initializeData').onclick=initializeDataSheet;
    }
    function initializeDataSheet(){openSheet('初始化数据',`<p class="mini-note">将清空全部作品、章节、全局角色和动作资料，并重置 AI 设置与阅读、消息字号。此操作无法撤销。</p><div class="sheet-actions"><button class="btn" id="cancelInitialize">取消</button><button class="btn danger" id="confirmInitialize">确认初始化</button></div>`);$('cancelInitialize').onclick=archiveSheet;$('confirmInitialize').onclick=()=>{const previous=state,previousKey=apiKey,wasDamaged=storageDamaged;state=emptyState();storageDamaged=false;if(!saveApiSettings({...state.apiConfig,key:''})){state=previous;storageDamaged=wasDamaged;updateStorageError();notify('初始化失败，原有资料未改变');return}if(!saveState()){state=previous;storageDamaged=wasDamaged;if(!saveApiSettings({...previous.apiConfig,key:previousKey}))notify('初始化失败，AI 设置也未能回退，请检查设置');else notify('初始化失败，原有资料未改变');updateStorageError();return}apiKey='';$('app').style.setProperty('--reader-font-size',`${state.readerFontSize}px`);$('app').style.setProperty('--message-font-size',`${state.messageFontSize}px`);render();newBookSheet()}}
    function showSheet(name){if(guardBusy())return;if(!book()&&(name==='roles'||name==='growth')){newBookSheet();return}({books:booksSheet,roles:roleSheet,actions:actionSheet,globalRoles:globalRoleSheet,growth:growthSheet,api:apiSheet,fontSize:fontSizeSheet,messageFontSize:messageFontSizeSheet,help:helpSheet,version:versionSheet})[name]?.()}
    $('menuButton').onclick=()=>{if(!guardBusy())$('drawerBackdrop').hidden=false};
    $('railToggleButton').onclick=()=>{if(guardBusy())return;state.railCompact=!state.railCompact;saveState();render()};
    $('closeDrawer').onclick=closeDrawer;
    $('drawerBackdrop').onclick=e=>{if(e.target===$('drawerBackdrop'))closeDrawer()};
    document.querySelectorAll('[data-sheet]').forEach(el=>el.onclick=()=>{closeDrawer();showSheet(el.dataset.sheet)});
    $('closeSheet').onclick=()=>leaveSheet();
    $('sheetBackdrop').onclick=e=>{if(e.target===$('sheetBackdrop'))leaveSheet()};
    $('archiveButton').onclick=()=>{if(!guardBusy())archiveSheet()};
    document.querySelectorAll('.tab').forEach(el=>el.onclick=()=>setTab(el.dataset.tab));
    $('newChapterButton').onclick=()=>generateChapter();
    $('continueButton').onclick=openDirections;
    $('refillButton').onclick=refillSheet;
    $('clearButton').onclick=clearDraftSheet;
    $('stopButton').onclick=stopTask;
    $('instruction').oninput=()=>{const current=book();if(current){current.draft=$('instruction').value;$('clearButton').disabled=!current.draft;scheduleSave()}};
    document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('discardBackdrop').hidden)$('keepEditing').click();else if(!$('sheetBackdrop').hidden)leaveSheet();else closeDrawer()}});
    window.addEventListener('resize',updateReaderScrollbar);
    if(!state.books.some(b=>b.id===state.activeBookId))state.activeBookId=state.books[0]?.id||null;
    if(nativeHost&&state.pendingNativeTask)void resumeNativeTask();else if(state.activeTab==='reader'&&state.readerContinuous&&book())prepareReader();else render();
    if(storageDamaged)archiveSheet();else if(!state.books.length)startSheet();else if(!activeTask&&book()?.pendingDirections)showDirectionChoices(book());
    if(nativeHost)AndroidBridge.pageReady();
  </script>
</body>
</html>
