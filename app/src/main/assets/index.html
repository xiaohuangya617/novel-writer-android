<body>
  <div class="app" id="app">
    <header class="topbar">
      <button class="icon-btn" id="menuButton" aria-label="打开菜单" title="菜单"><i class="fa-solid fa-bars"></i></button>
      <button class="icon-btn" id="railToggleButton" aria-label="压缩书架和章节" title="压缩书架和章节" aria-pressed="false"><i class="fa-solid fa-angles-left"></i></button>
      <span class="book-name" id="topBookName"></span>
      <button class="icon-btn" id="archiveButton" aria-label="存档" title="存档"><i class="fa-solid fa-box-archive"></i></button>
    </header>
    <div class="storage-error" id="storageError" role="alert" hidden>保存失败。请保持应用打开，并导出项目存档。</div>
    <div class="workspace">
      <aside class="rail" aria-label="作品和章节">
        <section class="rail-section books"><div class="rail-head"><span>书架</span></div><div class="rail-scroll" id="booksList"></div></section>
        <section class="rail-section chapters"><div class="rail-head"><span>章节</span></div><div class="rail-scroll" id="chaptersList"></div></section>
      </aside>

    function renderUpdatePanel(){

      const data=updateState,status=data.status,version=data.version?` ${esc(data.version)}`:'';
      let content='<h3 class="update-heading">应用更新</h3>';
      if(!nativeHost)content+='<p class="mini-note">请在安卓 App 中检查更新。</p>';
      else if(status==='checking')content+='<p class="mini-note"><i class="fa-solid fa-spinner fa-spin"></i> 正在检查正式版…</p>';
      else if(status==='progress'||status==='cancelling')content+=`<p class="mini-note">${status==='cancelling'?'正在取消下载…':`正在下载${version}：${Number(data.percent)||0}%`}</p>${data.message&&status==='progress'?`<p class="mini-note">${esc(data.message)}</p>`:''}<progress class="update-progress" max="100" value="${Number(data.percent)||0}"></progress><div class="sheet-actions"><button class="btn" id="cancelUpdateDownload" ${status==='cancelling'?'disabled':''}>取消下载</button></div>`;

      else if(status==='downloaded'||status==='permission'||status==='installing'||status==='installError')content+=`<p class="mini-note">${esc(data.message||'更新包已下载')}</p><div class="sheet-actions"><button class="btn primary" id="installUpdate"><i class="fa-solid fa-mobile-screen-button"></i> ${status==='downloaded'?'安装更新':'再次安装'}</button></div>`;
      else if(status==='downloadMissing')content+=`<p class="mini-note">${esc(data.message)}</p><div class="sheet-actions"><button class="btn primary" id="downloadUpdate">重新下载</button></div>`;
      else content+=`${data.message?`<p class="mini-note">${esc(data.message)}</p>`:''}<div class="sheet-actions">${data.canCancel?'<button class="btn" id="cancelUpdateDownload">取消下载</button>':data.canDownload?'<button class="btn primary" id="downloadUpdate">重新下载</button>':'<button class="btn primary" id="checkUpdate"><i class="fa-solid fa-rotate"></i> 检查更新</button>'}</div>`;

      if($('installUpdate'))$('installUpdate').onclick=()=>{if(guardBusy())return;try{AndroidBridge.installUpdate()}catch(e){updateState={...updateState,status:'error',message:'无法打开系统安装器'};renderUpdatePanel()}};
    }

    function helpSheet(){openSheet('使用说明','<div class="help-copy"><p><strong>1. 开始使用：</strong>首次打开可新建书籍或恢复 App 存档；新建后进入“提示”页签，再到“AI设置”填写并测试 API。</p><p><strong>2. 资料与书架：</strong>书架管理用于新建、删除和切换作品；设定、提示、本书角色、动作、服装和禁用词会参与当前书创作。素材角色需先导入本书。</p><p><strong>3. 写作：</strong>在消息框输入要求后点“发送”；“走向”生成三条候选方向并回填消息框，“回填”“清空”“停止”分别处理草稿和任务。生成期间界面会锁定。</p><p><strong>4. 走向策略：</strong>默认 X 策略包含主动攻略、信息揭示、关系互动；H 策略包含主动攻略、被动转折、女主视角。可在侧边栏切换。</p><p><strong>5. 主线软约束：</strong>想在指定章节收束时，可在主线大纲开头写明“目标：在第100章内完结；优先解决现有主线，不再开启大型支线”。这是给 AI 的软引导。</p><p><strong>6. 阅读与字号：</strong>消息、正文、设定、提示可用页签切换；阅读模式支持连续阅读，切换章节或页签会退出并回到章节开头。字号调整范围 12–30px，默认正文 20px、消息 16px。</p><p><strong>7. 续写作品：</strong>从书架管理导入 TXT，软件自动分章、选取、分析、融合并创建新书；失败阶段可在浮窗中重试或跳过，完成后资料会回填到提示、设定和本书角色库。</p><p><strong>8. 草稿本：</strong>侧边栏 AI设置下方可记录灵感，支持新增、修改、复制和删除；复制只复制草稿内容，不包含标题，草稿不会进入 AI 请求。</p><p><strong>9. 高级功能与存档：</strong>开发者选项连续点击 7 次解锁，可查看和修改实际发送给 API 的 6 条创作链 Prompt；修改前建议备份。原作参考章节也支持独立宽屏阅读。导出正文时可选择仅续作或含原作；普通新书没有原作时，含原作选项不可用。右上角还可导出 App/HTML 存档、恢复 App 存档、初始化数据；当前版本中可检查更新。</p></div>')}

      const specialSuffix='(?:[ \\t]*[:：、.．\\-—_][ \\t]*[^\\n]{0,60}|[ \\t]+[^\\n]{0,60})?';

      const read=()=>({url:$('apiUrl').value.trim(),key:$('apiKey').value.trim(),model:$('apiModel').value.trim(),temperature:$('apiTemp').value,topP:$('apiTopP').value,presence:$('apiPresence').value,frequency:$('apiFrequency').value,repetition:$('apiRepetition').value,maxTokens:$('apiMax').value,ctxChapters:$('apiCtx').value,stopWords:$('apiStop').value,reasoning:$('apiReasoning').value,thinking:$('apiThinking').checked});
      const persist=cfg=>{if(!saveApiSettings(cfg))return false;apiKey=cfg.key;const {key,...publicConfig}=cfg;state.apiConfig=publicConfig;markApiSaved();return true};
      $('apiForm').onsubmit=e=>{e.preventDefault();const cfg=read();if(!$('apiForm').reportValidity())return;if(!persist(cfg))return;closeSheet();notify('AI 设置已保存')};
      $('testApi').onclick=async()=>{const form=$('apiForm'),cfg=read(),tested=JSON.stringify(cfg);if(!form.reportValidity())return;if(!cfg.key){$('apiTestStatus').textContent='请填写 API Key';return}const button=$('testApi'),status=$('apiTestStatus');button.disabled=true;status.textContent='正在连接…';const controller=new AbortController();apiTestController=controller;const messages=[{role:'user',content:'请只回复：连接成功'}];const body={model:cfg.model,messages,max_tokens:cfg.thinking?1024:128};if(cfg.thinking){body.thinking={type:'enabled'};body.reasoning_effort=cfg.reasoning}try{const result=await requestAI(cfg,messages,controller,body.max_tokens,body,30000,false);if($('apiForm')===form){if(JSON.stringify(read())!==tested){status.textContent='测试期间设置已修改，请重新测试或保存当前设置';return}const saved=persist(cfg);status.textContent=result.content?(saved?'连接及回复正常，当前设置已保存':'连接及回复正常，但设置保存失败'):(saved?'API 已连通，但本次没有返回文字；设置已保存，请检查模型与思考模式':'API 已连通，但本次没有返回文字，且设置保存失败')}}catch(err){if($('apiForm')===form)status.textContent=JSON.stringify(read())!==tested?'测试期间设置已修改，请重新测试或保存当前设置':`连接失败：${apiError(err)}`}finally{if(apiTestController===controller)apiTestController=null;button.disabled=false}}
    }
    function pcApiConfig(){const cfg=state.apiConfig;return {url:cfg.url,key:'',model:cfg.model,temp:Number(cfg.temperature),top_p:Number(cfg.topP),presPenalty:Number(cfg.presence),freqPenalty:Number(cfg.frequency),repetition_penalty:Number(cfg.repetition),maxTokens:Number(cfg.maxTokens),ctxChapters:Number(cfg.ctxChapters),stopWords:cfg.stopWords,thinking:cfg.thinking,reasoningEffort:cfg.reasoning}}
    function backupObject(){return {version:'7.7',appArchiveVersion:1,timestamp:Date.now(),books:state.books,currentBookId:state.activeBookId,globalActions:state.actions,globalCharacters:state.globalCharacters,globalCostumes:state.globalCostumes,globalForbiddenWords:state.globalForbiddenWords,draftNotes:state.draftNotes,developerPrompts:NovelCore.migrateDeveloperPrompts(state.developerPrompts),branchStrategy:NovelCore.normalizeBranchStrategy(state.branchStrategy),appReaderFontSize:state.readerFontSize,appMessageFontSize:state.messageFontSize,appConfig:{...state.apiConfig},apiConfig:pcApiConfig()}}
    function htmlBackupObject(){const costumes=state.globalCostumes.map(item=>{const copy={...item};if(copy.details){copy.styleDetail=copy.details;copy.descriptionTips=''}delete copy.details;return copy});return {version:'7.7',timestamp:Date.now(),books:state.books,currentBookId:state.activeBookId,globalCharacters:state.globalCharacters,globalActions:state.actions,globalCostumes:costumes,globalForbiddenWords:state.globalForbiddenWords,apiConfig:pcApiConfig(),scratchpadPages:['','','','',''],scratchpadContent:'',appLogs:[],costStats:{},customTags:[],graphHighlights:{},sbDraft:'',dailyInputStats:''}}
    function backupFile(format='App'){const stamp=new Date().toISOString().replace(/[-:]/g,'').replace('T','_').slice(0,15);return new File([JSON.stringify(format==='HTML'?htmlBackupObject():backupObject(),null,2)],`小说项目_${format}_${stamp}.json`,{type:'application/json'})}
    function bookText(current,includeSource=false){const source=(current.chapters||[]).filter(item=>item.sourceChapter),stories=storyChapters(current),chapters=includeSource?source.concat(stories):stories;return '\uFEFF'+current.name+'\r\n\r\n'+chapters.map((item,index)=>{let body=String(item.content||'').replace(/\r\n?/g,'\n').trim();body=body.replace(/^#{1,6}\s+[^\n]+\n+/, '');return `${item.title||`第${item.sourceChapter?'0':index+1}章`}\n\n${body}`.replace(/\n/g,'\r\n')}).join('\r\n\r\n')+'\r\n'}
    function downloadFile(file){const url=URL.createObjectURL(file);const link=document.createElement('a');link.href=url;link.download=file.name;link.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
    function restoreProject(data){
      if(!record(data)||data.appArchiveVersion!==1||!Array.isArray(data.books)||!Array.isArray(data.globalActions))throw Error('只支持本 App 导出的项目存档');
      if(!validLibrary(data.books,data.globalActions,data.globalCharacters===undefined?[]:data.globalCharacters,data.globalCostumes===undefined?[]:data.globalCostumes,data.globalForbiddenWords===undefined?[]:data.globalForbiddenWords))throw Error('存档中的作品、章节、消息或资料不完整');
      if(!record(data.appConfig)||typeof data.appConfig.url!=='string'||typeof data.appConfig.model!=='string'||Object.values(data.appConfig).some(value=>value!==null&&!['string','number','boolean'].includes(typeof value)))throw Error('存档中的 AI 设置不完整');
      const returnToStart=$('sheetTitle').textContent==='开始使用';
      openSheet('确认恢复',`<p class="mini-note">将用此存档替换 App 中的全部作品、全局角色和动作资料。此操作无法撤销。</p><div class="sheet-actions"><button class="btn" id="cancelRestore">取消</button><button class="btn danger" id="confirmRestore">恢复存档</button></div>`);
      $('cancelRestore').onclick=returnToStart?startSheet:archiveSheet;
      $('confirmRestore').onclick=()=>{
        const previous=state,previousKey=apiKey,wasDamaged=storageDamaged;
        state={...emptyState(),books:data.books,actions:data.globalActions,globalCharacters:data.globalCharacters===undefined?[]:data.globalCharacters,globalCostumes:data.globalCostumes===undefined?[]:data.globalCostumes,globalForbiddenWords:data.globalForbiddenWords===undefined?[]:data.globalForbiddenWords,draftNotes:Array.isArray(data.draftNotes)?data.draftNotes:[],developerPrompts:NovelCore.migrateDeveloperPrompts(data.developerPrompts),branchStrategy:NovelCore.normalizeBranchStrategy(data.branchStrategy),readerFontSize:fontSize(data.appReaderFontSize,DEFAULT_READER_FONT_SIZE),messageFontSize:fontSize(data.appMessageFontSize,DEFAULT_MESSAGE_FONT_SIZE),activeBookId:data.books.some(item=>item.id===data.currentBookId)?data.currentBookId:data.books[0]?.id||null,apiConfig:{...emptyState().apiConfig,...data.appConfig}};
        state.draftNotes=Array.isArray(state.draftNotes)?state.draftNotes.filter(item=>record(item)&&typeof item.id==='string'&&item.id&&typeof item.name==='string'&&item.name.trim()&&typeof item.content==='string'):[];
        normalizeBooks(state.books);
        delete state.apiConfig.key;
        state.selectedChapterId=book()?.chapters?.at(-1)?.id||null;
        storageDamaged=false;
        if(!saveApiSettings({...state.apiConfig,key:''})){state=previous;storageDamaged=wasDamaged;updateStorageError();notify('恢复失败，原有资料未改变');return}
        if(!saveState()){state=previous;storageDamaged=wasDamaged;if(!saveApiSettings({...previous.apiConfig,key:previousKey}))notify('恢复失败，AI 设置也未能回退，请检查设置');else notify('恢复失败，原有资料未改变');updateStorageError();return}
        apiKey='';$('app').style.setProperty('--reader-font-size',`${state.readerFontSize}px`);$('app').style.setProperty('--message-font-size',`${state.messageFontSize}px`);
        closeSheet();render();if(!state.books.length)newBookSheet();notify('存档已恢复');
      };
    }
    window.nativeBackupImported=raw=>{try{restoreProject(JSON.parse(raw))}catch(err){notify(err.message||'无法读取此存档')}};
    window.nativeExportSaved=message=>notify(message||'文件已导出');
    window.nativeBackupError=message=>notify(`文件操作失败：${message}`);
    function confirmExitDuringTask(){openSheet('停止生成并退出？','<p class="mini-note">AI 正在处理。退出会停止当前请求，已保存的内容仍会保留。</p><div class="sheet-actions"><button class="btn" id="keepWaiting">继续等待</button><button class="btn danger" id="stopAndExit">停止并退出</button></div>');$('keepWaiting').onclick=closeSheet;$('stopAndExit').onclick=()=>{closeSheet();stopTask();AndroidBridge.exitApp()}}
    window.androidBack=()=>{if(!$('discardBackdrop').hidden){$('keepEditing').click();return true}if(!$('sheetBackdrop').hidden){leaveSheet();return true}if(!$('drawerBackdrop').hidden){closeDrawer();return true}if(busy()){confirmExitDuringTask();return true}if(state.readerContinuous){toggleReaderMode();return true}return false};
    function exportBackup(format){const payload=format==='HTML'?htmlBackupObject():backupObject();if(nativeHost){if(format==='HTML')AndroidBridge.exportHtmlProject(JSON.stringify(payload));else AndroidBridge.exportProject(JSON.stringify(payload));return}downloadFile(backupFile(format));notify(`${format} 项目存档已导出`)}
    async function shareBackup(format){if(nativeHost){if(format==='HTML')AndroidBridge.shareHtmlProject(JSON.stringify(htmlBackupObject()));else AndroidBridge.shareProject(JSON.stringify(backupObject()));return}const file=backupFile(format);if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:`小说项目存档（${format}）`});notify('已打开系统分享')}catch(e){if(e.name!=='AbortError')notify('分享未完成')}}else{downloadFile(file);notify('当前浏览器已改为下载存档')}}
    function chooseArchiveSheet(format){const label=format==='HTML'?'HTML':'App';openSheet(`导出/分享项目存档（${label}）`,`<div class="sheet-list"><button class="btn wide" id="exportArchiveChoice"><i class="fa-solid fa-download"></i> 导出项目存档（${label}）</button><button class="btn primary wide" id="shareArchiveChoice"><i class="fa-solid fa-share-nodes"></i> 分享项目存档（${label}）</button></div><p class="mini-note" style="margin-top:14px">${label==='HTML'?'供 PC 网页版导入。':'用于 App 恢复。'}存档均不包含 API Key。</p>`);$('exportArchiveChoice').onclick=()=>exportBackup(format);$('shareArchiveChoice').onclick=()=>shareBackup(format)}
    function exportBookTextRange(includeSource){const current=book(),source=(current?.chapters||[]).filter(item=>item.sourceChapter),stories=storyChapters(current);if(!current||(!source.length&&!stories.length))return;if(!includeSource&&!stories.length){notify('当前没有可导出的续写正文');return}const content=bookText(current,includeSource),suffix=includeSource?'正文含原作':'正文仅续作';if(nativeHost)AndroidBridge.exportBookText(content,current.name,suffix);else{downloadFile(new File([content],`${current.name}_${suffix}.txt`,{type:'text/plain;charset=utf-8'}));notify(includeSource?'正文（含原作）已导出':'正文（仅续作）已导出')}}
    function bookTextExportSheet(){const current=book();if(!current?.chapters?.length)return;const source=(current.chapters||[]).filter(item=>item.sourceChapter),stories=storyChapters(current);openSheet('导出本书正文/含原作（txt）',`<p class="mini-note">请选择导出范围。导出不会改变作品内容。</p><div class="sheet-list"><button class="btn wide" id="exportStoryText" ${stories.length?'':'disabled'}><i class="fa-solid fa-file-lines"></i> 导出本书正文（仅续作）</button><button class="btn wide" id="exportSourceText" ${source.length?'':'disabled'}><i class="fa-solid fa-book-open"></i> 导出本书正文（含原作）</button></div>${source.length?'':'<p class="mini-note" style="margin-top:12px">当前作品没有原作参考资料，“含原作”不可用。</p>'}`);$('exportStoryText').onclick=()=>exportBookTextRange(false);$('exportSourceText').onclick=()=>exportBookTextRange(true)}
    function archiveSheet(){
      openSheet('存档与分享',`<div class="sheet-list"><button class="btn wide" id="exportBookText" ${book()?.chapters?.length?'':'disabled'}><i class="fa-solid fa-file-lines"></i> 导出本书正文/含原作（txt）</button><button class="btn wide" id="chooseAppArchive"><i class="fa-solid fa-box-archive"></i> 导出/分享项目存档（app）</button><button class="btn wide" id="chooseHtmlArchive"><i class="fa-solid fa-desktop"></i> 导出/分享项目存档（html）</button><label class="btn primary wide" for="restoreFile"><i class="fa-solid fa-rotate-left"></i> 恢复项目存档（app）</label><input id="restoreFile" type="file" accept=".json,application/json" hidden><button class="btn danger wide" id="initializeData"><i class="fa-solid fa-trash"></i> 初始化所有数据</button></div><p class="mini-note" style="margin-top:14px">App 存档用于本机恢复；HTML 存档供 PC 网页版导入。均不包含 API Key。</p>`);
      $('chooseAppArchive').onclick=()=>chooseArchiveSheet('App');
      $('chooseHtmlArchive').onclick=()=>chooseArchiveSheet('HTML');
      $('exportBookText').onclick=()=>bookTextExportSheet();
      $('restoreFile').onchange=async e=>{if(nativeHost)return;const file=e.target.files?.[0];if(!file)return;try{restoreProject(JSON.parse(await file.text()))}catch(err){notify(err.message||'无法读取此存档')}};
      if(nativeHost)$('restoreFile').previousElementSibling.onclick=e=>{e.preventDefault();AndroidBridge.chooseProject()};
      $('initializeData').onclick=initializeDataSheet;
    }
    function initializeDataSheet(){openSheet('初始化数据',`<p class="mini-note">将清空全部作品、章节、全局角色、动作、服装、全局禁用词和草稿本，并重置 AI 设置与阅读、消息字号。此操作无法撤销。</p><div class="sheet-actions"><button class="btn" id="cancelInitialize">取消</button><button class="btn danger" id="confirmInitialize">确认初始化</button></div>`);$('cancelInitialize').onclick=archiveSheet;$('confirmInitialize').onclick=()=>{const previous=state,previousKey=apiKey,wasDamaged=storageDamaged;state=emptyState();storageDamaged=false;if(!saveApiSettings({...state.apiConfig,key:''})){state=previous;storageDamaged=wasDamaged;updateStorageError();notify('初始化失败，原有资料未改变');return}if(!saveState()){state=previous;storageDamaged=wasDamaged;if(!saveApiSettings({...previous.apiConfig,key:previousKey}))notify('初始化失败，AI 设置也未能回退，请检查设置');else notify('初始化失败，原有资料未改变');updateStorageError();return}apiKey='';$('app').style.setProperty('--reader-font-size',`${state.readerFontSize}px`);$('app').style.setProperty('--message-font-size',`${state.messageFontSize}px`);render();newBookSheet()}}
    function showSheet(name){if(guardBusy())return;if(!book()&&(name==='roles'||name==='growth')){newBookSheet();return}({books:booksSheet,forbiddenWords:forbiddenWordsSheet,roles:roleSheet,actions:actionSheet,costumes:costumeSheet,globalRoles:globalRoleSheet,growth:growthSheet,api:apiSheet,drafts:draftNotesSheet,strategy:strategySheet,fontSize:fontSizeSheet,help:helpSheet,developer:developerSheet,version:versionSheet})[name]?.()}
    $('menuButton').onclick=()=>{if(!guardBusy())$('drawerBackdrop').hidden=false};
    $('railToggleButton').onclick=()=>{if(guardBusy())return;state.railCompact=!state.railCompact;saveState();render()};
    $('closeDrawer').onclick=closeDrawer;
    $('drawerBackdrop').onclick=e=>{if(e.target===$('drawerBackdrop'))closeDrawer()};
    document.querySelectorAll('[data-sheet]').forEach(el=>el.onclick=()=>{if(el.dataset.sheet==='developer'){if(developerUnlocked){closeDrawer();developerSheet();return}developerClickCount+=1;clearTimeout(developerClickTimer);developerClickTimer=setTimeout(()=>{developerClickCount=0},5000);if(developerClickCount>=7){developerUnlocked=true;developerClickCount=0;closeDrawer();developerSheet();notify('开发者选项已解锁，本次打开有效')}else notify('开发者选项已锁定，还需连续点击 '+(7-developerClickCount)+' 次');return}closeDrawer();showSheet(el.dataset.sheet)});
    $('closeSheet').onclick=()=>leaveSheet();
    $('sheetBackdrop').onclick=e=>{if(e.target===$('sheetBackdrop'))leaveSheet()};
    $('archiveButton').onclick=()=>{if(!guardBusy())archiveSheet()};
    document.querySelectorAll('.tab').forEach(el=>el.onclick=()=>setTab(el.dataset.tab));
    $('newChapterButton').onclick=()=>generateChapter();
    $('continueButton').onclick=openDirections;
    $('refillButton').onclick=refillSheet;
    $('clearButton').onclick=clearDraftSheet;
    $('stopButton').onclick=stopTask;
    $('instruction').oninput=()=>{const current=book();if(current){current.draft=$('instruction').value;$('clearButton').disabled=!current.draft;scheduleSave()}};
    document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('discardBackdrop').hidden)$('keepEditing').click();else if(!$('sheetBackdrop').hidden)leaveSheet();else closeDrawer()}});
    window.addEventListener('resize',updateReaderScrollbar);
    if(!state.books.some(b=>b.id===state.activeBookId))state.activeBookId=state.books[0]?.id||null;
    if(nativeHost&&state.pendingNativeTask)void resumeNativeTask();else if(state.activeTab==='reader'&&state.readerContinuous&&book())prepareReader();else render();
    if(storageDamaged)archiveSheet();else if(!state.books.length)startSheet();else if(!activeTask&&book()?.pendingDirections)showDirectionChoicesV2(book());
    if(nativeHost)AndroidBridge.pageReady();
  </script>
