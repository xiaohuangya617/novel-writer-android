plugins {
    id 'com.android.application'
}

def appVersionSource = file('src/main/assets/version.js').text
def appVersionMatcher = appVersionSource =~ /NOVEL_APP_VERSION\s*=\s*'([^']+)'/
if (!appVersionMatcher.find()) throw new GradleException('version.js 中缺少版本号')
def appVersion = appVersionMatcher.group(1)
def releasePassword = System.getenv('NOVEL_RELEASE_PASSWORD')
def geminiPassword = System.getenv('GEMINI_RELEASE_PASSWORD')

android {
    namespace 'com.novelwriter.mobile'
    compileSdk 35

    defaultConfig {
        applicationId 'com.novelwriter.mobile'
        minSdk 26
        targetSdk 35
        versionCode 48
        versionName appVersion
        resValue 'string', 'app_name', 'AI 小说创作'
    }

    signingConfigs {
        release {
            storeFile rootProject.file('发布签名/novel-release.jks')
            storePassword releasePassword ?: ''
            keyAlias 'novel-release'
            keyPassword releasePassword ?: ''
        }
        gemini {
            storeFile rootProject.file('发布签名/gemini-test.jks')
            storePassword geminiPassword ?: ''
            keyAlias 'gemini-test'
            keyPassword geminiPassword ?: ''
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        geminiTest {
            initWith release
            applicationIdSuffix '.gemini'
            versionNameSuffix '-gemini'
            resValue 'string', 'app_name', '小说生成器 Gemini 测试版'
            signingConfig signingConfigs.gemini
            matchingFallbacks = ['release']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            output.outputFileName = "${variant.versionName}小说生成器.apk"
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
}
